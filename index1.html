<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Siciliano Bath & Tile | Work Gallery</title>
  <meta name="description" content="Photo gallery of showers, baths, and tile work by Siciliano Bath & Tile. Pittsburgh area. Call 412-849-9884." />
  <style>
    :root {
      --bg: #141210;
      --bg-2: #1c1916;
      --card: #24201c;
      --line: #3a342c;
      --text: #f4efe6;
      --muted: #b7ab9c;
      --accent: #c4a574;
      --accent-2: #e8d7b8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    a { color: inherit; }
    .wrap { width: min(1100px, calc(100% - 32px)); margin: 0 auto; }
    header {
      padding: 28px 0 18px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: rgba(20, 18, 16, 0.94);
      backdrop-filter: blur(8px);
      z-index: 5;
    }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-size: 14px; }
    .brand img { height: 72px; width: auto; display: block; filter: brightness(0) invert(1); }
    .brand .fallback { display: none; }
    .brand.nologo img { display: none; }
    .brand.nologo .fallback { display: block; }
    .brand strong { display: block; font-size: 22px; letter-spacing: 0.14em; font-weight: 700; }
    .brand span { color: var(--accent); font-size: 12px; letter-spacing: 0.22em; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      text-decoration: none;
      border: 1px solid var(--accent);
      color: var(--bg);
      background: var(--accent);
      padding: 12px 16px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      letter-spacing: 0.04em;
      border-radius: 4px;
    }
    .callbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #1c1916;
      border-top: 1px solid var(--line);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }
    .callbar a {
      display: block;
      text-align: center;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      padding: 14px 8px;
      border-radius: 6px;
    }
    .callbar .call, .callbar .mail { background: transparent; color: var(--accent-2); border: 1px solid var(--accent); }
    .hero { padding: 36px 0 10px; }
    h1 { font-weight: 500; font-size: clamp(32px, 5vw, 52px); margin: 18px 0 10px; text-align: center; }
    .lede { color: var(--muted); max-width: 640px; font-size: 18px; margin: 0 0 8px; }
    .meta { color: var(--accent-2); font-family: Arial, Helvetica, sans-serif; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; text-align: center; }
    .warranty { color: var(--muted); font-family: Arial, Helvetica, sans-serif; font-size: 12px; letter-spacing: 0.06em; margin: 6px 0 0; text-transform: uppercase; text-align: center; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
      padding-bottom: 96px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      color: inherit;
      padding: 0;
      width: 100%;
    }
    .card img, .ph {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: #2b261f;
    }
    .ph {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      padding: 16px;
      text-align: center;
    }
    .cap { padding: 12px 12px 14px; }
    .cap b { display: block; font-weight: 600; font-size: 16px; }
    .cap small { color: var(--muted); font-family: Arial, Helvetica, sans-serif; }
    footer {
      border-top: 1px solid var(--line);
      padding: 28px 0 40px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }
    footer a { color: var(--accent-2); }
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: min(1000px, 100%); max-height: 78vh; border-radius: 6px; }
    #lightbox .box { max-width: 1000px; width: 100%; }
    #lightbox p { color: #fff; font-family: Arial, Helvetica, sans-serif; }
    #lightbox .x {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      color: #fff;
      border: 1px solid #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
    }
    @media (max-width: 700px) {
      .wrap { width: min(1100px, calc(100% - 20px)); }
      header { padding: 12px 0; }
      .top { flex-direction: column; align-items: stretch; gap: 12px; }
      .brand { justify-content: center; }
      .brand img { height: 58px; margin: 0 auto; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .btn { text-align: center; padding: 14px 8px; font-size: 15px; }
      .hero { padding: 22px 0 6px; }
      h1 { font-size: 34px; }
      .lede { font-size: 16px; }
      .grid { grid-template-columns: 1fr; gap: 12px; padding-bottom: 88px; }
      .card img, .ph { height: 240px; }
      footer { padding-bottom: 96px; }
      .callbar {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap top">
      <div class="brand" id="brand">
        <img src="images/logo.png" alt="Siciliano Bath and Tile" onerror="document.getElementById('brand').classList.add('nologo')" />
        <div class="fallback">
          <strong>Siciliano</strong>
          <span>Bath & Tile</span>
        </div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <p class="meta">Full bath remodels · Showers · Tile</p>
      <p class="warranty">Lifetime leak warranty on all tiled showers</p>
      <h1>Work Gallery</h1>
      <p class="lede">Recent bath and tile jobs. Tap a photo to open it. Call or email for a quote.</p>
    </section>
    <section class="grid" id="grid"></section>
  </main>
  <footer>
    <div class="wrap">
      Siciliano Bath & Tile · <a href="tel:4128499884">412-849-9884</a> · <a href="mailto:SicilianoTile@gmail.com">SicilianoTile@gmail.com</a>
    </div>
  </footer>
  <div class="callbar">
    <a class="call" href="tel:4128499884">Call 412-849-9884</a>
    <a class="mail" href="mailto:SicilianoTile@gmail.com">Email</a>
  </div>
  <div id="lightbox" role="dialog">
    <button class="x" id="close" aria-label="Close">×</button>
    <div class="box">
      <img id="full" alt="" />
      <p id="fullcap"></p>
    </div>
  </div>
  <script>
    /* ADD A JOB: copy a block, change title/tag/file.
       Put the photo in the images folder with the same file name.
       Tags: shower, floor, bath */
    const jobs = [
      { title: "Shower 1", tag: "shower", file: "images/01.jpg", note: "Replace this caption" },
      { title: "Shower 2", tag: "shower", file: "images/02.jpg", note: "Replace this caption" },
      { title: "Floor 1", tag: "floor", file: "images/03.jpg", note: "Replace this caption" },
      { title: "Bath 1", tag: "bath", file: "images/04.jpg", note: "Replace this caption" },
      { title: "Shower 3", tag: "shower", file: "images/05.jpg", note: "Replace this caption" },
      { title: "Floor 2", tag: "floor", file: "images/06.jpg", note: "Replace this caption" }
    ];
    const grid = document.getElementById("grid");
    function draw() {
      grid.innerHTML = "";
      jobs.forEach((job) => {
        const btn = document.createElement("button");
        btn.className = "card";
        btn.innerHTML =
          '<img alt="' + job.title + '" src="' + job.file + '" />' +
          '<div class="cap"><b>' + job.title + '</b><small>' + job.note + '</small></div>';
        const img = btn.querySelector("img");
        img.onerror = () => {
          img.replaceWith(Object.assign(document.createElement("div"), {
            className: "ph",
            textContent: "Add photo: " + job.file
          }));
        };
        btn.onclick = () => openJob(job);
        grid.appendChild(btn);
      });
    }
    function openJob(job) {
      document.getElementById("full").src = job.file;
      document.getElementById("fullcap").textContent = job.title + " — " + job.note;
      document.getElementById("lightbox").classList.add("open");
    }
    document.getElementById("close").onclick = () => document.getElementById("lightbox").classList.remove("open");
    document.getElementById("lightbox").onclick = (e) => {
      if (e.target.id === "lightbox") document.getElementById("lightbox").classList.remove("open");
    };
    draw();
  </script>
</body>
</html>
